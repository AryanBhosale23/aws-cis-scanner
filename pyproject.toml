[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cis-scanner"
version = "0.1.0"
description = "Read-only AWS scanner that checks CIS-based controls and writes audit evidence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["boto3>=1.34", "click>=8.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "moto[iam,s3,sts,cloudtrail,config,ec2,kms]>=5", "ruff>=0.5"]

[project.scripts]
scanner = "scanner.cli:main"

[tool.setuptools.packages.find]
include = ["scanner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
